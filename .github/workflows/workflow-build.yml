name: Build documentation

on:
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        language: ["en", "fr", "es", "ja", "pt"]
    runs-on: ubuntu-latest
    steps:
      - name: Set directory
        env:
          LANGUAGE: ${{ matrix.language }}
        run: echo "DEST_FOLDER=./build/$LANGUAGE" >> $GITHUB_ENV
      - name: Get disk space
        run: |
          df -h /
          sudo rm -rf \
          "$AGENT_TOOLSDIRECTORY" \
          /opt/google/chrome \
          /opt/microsoft/msedge \
          /opt/microsoft/powershell \
          /opt/pipx \
          /usr/lib/mono \
          /usr/local/julia* \
          /usr/local/lib/android \
          /usr/local/lib/node_modules \
          /usr/local/share/chromium \
          /usr/local/share/powershell \
          /usr/share/dotnet \
          /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
      - name: Build
        env:
          LANGUAGE_TO_BUILD: ${{ matrix.language }}
        run: |
          if [ -e package-lock.json ]; then
          npm ci
          else
          npm i
          fi
          if [ "$LANGUAGE_TO_BUILD" = 'en' ]; then
            npm run build -- --locale $LANGUAGE_TO_BUILD
          else
            npm run build -- --locale $LANGUAGE_TO_BUILD --out-dir ./build/$LANGUAGE_TO_BUILD
          fi
      - name: Google verification
        if: matrix.language == 'en'
        run: |
          cd build
          echo "google-site-verification: google1a6263055b2bea44.html" >> google1a6263055b2bea44.html
      - name: Fix version-dropdown links
        uses: doc4d/doc_postprocessing@25244df5c2cea1370e0542602ffa513d563bf4ee # v1
        with:
          path: ./build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./build
          name: build-locale-${{ matrix.language }}
          retention-days: 5
